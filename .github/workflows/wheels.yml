# Build and test the Python wheels (cibuildwheel) and the source distribution.
# Runs on demand and for version tags (wheel builds use many runner minutes).
name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and test wheels
        run: |
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test the sdist
        run: |
          python -m pip install build
          python -m build --sdist
          python -m pip install dist/*.tar.gz
          cd /tmp && POTSYNTH_TEST_INSTALLED=1 python $GITHUB_WORKSPACE/tests/test_python.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
